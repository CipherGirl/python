version: 1
formatters:
  simple:
    format: "[%(asctime)s] [%(levelname)s] %(name)s: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: CRITICAL
    formatter: simple
    stream: ext://sys.stdout

  file:
    class: logging.FileHandler
    level: CRITICAL
    formatter: simple
    filename: app.log
    encoding: utf8

loggers:
  my_app:
    level: CRITICAL
    handlers: [console, file]
    propagate: no

root:
  level: WARNING
  handlers: [console]
